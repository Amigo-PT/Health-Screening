<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Health Screening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --main-gradient: linear-gradient(120deg, #2563eb, #06b6d4, #10b981);
            --bg: #020617;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.7);
            --border: rgba(255, 255, 255, 0.07);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes blobDrift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            40% { transform: translate(30px, -25px) scale(1.05); }
            70% { transform: translate(-20px, 15px) scale(0.97); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.05); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.2;
            pointer-events: none;
            animation: blobDrift 14s ease-in-out infinite;
            z-index: 0;
        }
        .blob-1 { width: 450px; height: 450px; background: #2563eb; top: -12%; left: -10%; animation-delay: 0s; }
        .blob-2 { width: 350px; height: 350px; background: #06b6d4; bottom: -10%; right: -8%; animation-delay: 5s; }
        .blob-3 { width: 250px; height: 250px; background: #10b981; top: 45%; left: 50%; animation-delay: 9s; }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .page-shell {
            width: min(100%, 1100px);
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 36px;
            box-shadow: 0 50px 120px rgba(0, 0, 0, 0.45);
            overflow: hidden;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s cubic-bezier(0.23,1,0.32,1) both;
        }

        .page-shell::before {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%; height: 2px;
            background: var(--main-gradient);
            border-radius: 100%;
        }

        .page-shell::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(6,182,212,0.05), transparent 40%, rgba(37,99,235,0.04));
            pointer-events: none;
        }

        .hero {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 3rem;
            padding: 60px 50px;
            position: relative;
            z-index: 1;
            align-items: center;
        }

        @media(max-width: 900px) {
            .hero { grid-template-columns: 1fr; padding: 40px 28px; text-align: center; }
            .actions { justify-content: center; }
        }

        .hero-copy {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(6,182,212,0.1);
            border: 1px solid rgba(6,182,212,0.2);
            color: #22d3ee;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.8rem;
            width: fit-content;
        }

        .title {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.03em;
            color: #ffffff;
        }
        .title span {
            background: var(--main-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-404 {
            font-size: clamp(4rem, 8vw, 7rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.04em;
            background: var(--main-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 4s ease-in-out infinite;
        }

        .description {
            max-width: 520px;
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--muted);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 12px;
        }

        .btn-primary,
        .btn-secondary {
            min-width: 160px;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.23,1,0.32,1);
        }

        .btn-primary {
            background: var(--main-gradient);
            border: none;
            color: #fff;
            box-shadow: 0 8px 25px rgba(6,182,212,0.3);
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px rgba(6,182,212,0.45);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text);
        }
        .btn-secondary:hover {
            background: rgba(6,182,212,0.1);
            border-color: rgba(6,182,212,0.3);
            color: #22d3ee;
            transform: translateY(-3px);
        }

        .hero-visual {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .visual-card {
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(6,182,212,0.05));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 36px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }

        .visual-card::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(6,182,212,0.2);
            border-radius: 50%;
            animation: pulse 3s ease-in-out infinite;
        }

        .visual-card::after {
            content: '';
            position: absolute;
            width: 140px;
            height: 140px;
            border: 2px solid rgba(6,182,212,0.15);
            border-radius: 50%;
            animation: pulse 3s ease-in-out infinite 0.5s;
        }

        .visual-icon {
            font-size: 5rem;
            background: var(--main-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 5s ease-in-out infinite;
        }

        .footer-note {
            padding: 20px 28px 28px;
            background: rgba(2,6,23,0.6);
            border-top: 1px solid var(--border);
            color: var(--muted);
            text-align: center;
            font-size: 0.9rem;
        }
        .footer-note a {
            color: #22d3ee;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="page-shell">
        <div class="hero">
            <div class="hero-copy">
                <span class="eyebrow"><i class="bi bi-exclamation-octagon-fill"></i> Page Not Found</span>
                <div class="title-404">404</div>
                <h1 class="title">Oops! <span>Not Found</span></h1>
                <p class="description">Looks like the page you were searching for doesn't exist. It may have been moved or is temporarily unavailable.</p>
                <div class="actions">
                    <a href="index.html" class="btn btn-primary"><i class="bi bi-house-door me-2"></i>Go Home</a>
                    <a href="screening.html" class="btn btn-secondary"><i class="bi bi-arrow-left me-2"></i>Go Back</a>
                </div>
            </div>
            <div class="hero-visual">
                <div class="visual-card">
                    <i class="bi bi-search visual-icon"></i>
                </div>
            </div>
        </div>
        <div class="footer-note">
            Need help? <a href="index.html">Return to Home</a> or <a href="mailto:info@hu.edu.eg">Contact Support</a>
        </div>
    </div>
</body>
</html>
