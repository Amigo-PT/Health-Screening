<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Health Screening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <style>
        :root {
            --main-gradient: linear-gradient(120deg, #2563eb, #06b6d4, #10b981);
            --bg-body: #020617;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.5);
        }

        /* Motion UI Keyframes */
        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            background-color: var(--bg-body);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: fadeInPage 0.8s ease-out;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: var(--glass-border);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--main-gradient);
        }

        .login-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1) 0%, rgba(16, 185, 129, 0.1) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 2.5rem;
            color: #06b6d4;
            animation: float 6s ease-in-out infinite;
        }

        .login-title {
            font-weight: 800;
            margin-bottom: 5px;
            background: var(--main-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
        }

        .form-control:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: #06b6d4;
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.15);
            color: #ffffff;
        }

        .form-label {
            font-size: 0.9rem;
            color: #e2e8f0;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .btn-login {
            background: var(--main-gradient);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            margin-top: 10px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.5);
            color: white;
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-msg {
            color: #fca5a5;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 20px;
            display: none;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.15);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            animation: fadeInPage 0.3s ease-out;
            line-height: 1.5;
        }

        .spinner-border {
            width: 1.5rem;
            height: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="login-card" data-aos="zoom-in" data-aos-duration="1000">
        <div class="login-icon">
            <i class="bi bi-shield-lock"></i>
        </div>
        <h3 class="text-center login-title">Welcome Back</h3>
        <p class="text-center login-subtitle">Please enter your credentials to access the dashboard.</p>

        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-login" id="loginBtn">
                <span id="btnText">Login</span>
                <span id="btnSpinner" class="spinner-border text-white d-none" role="status"></span>
            </button>

            <div id="errorMsg" class="error-msg">
                <!-- Error message will be injected here -->
            </div>
        </form>
    </div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Check if already logged in
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'index.html';
        }

        AOS.init();

        const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vROSvg9xVSBLkqDfzLCKOr0Fvb0k_CeAQT9PDQHJMWDCmjYswPUSjXmE0YkfX836Npy0ivzOY5y8iIZ/pub?gid=0&single=true&output=csv";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const errorMsg = document.getElementById('errorMsg');

            // UI Loading State
            btn.disabled = true;
            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');
            errorMsg.style.display = 'none';

            Papa.parse(sheetURL, {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    let userFound = false;
                    let passwordCorrect = false;

                    // Check credentials
                    for (let i = 0; i < data.length; i++) {
                        const rowUser = data[i].username ? data[i].username.toString().trim() : "";
                        const rowPass = data[i].password ? data[i].password.toString().trim() : "";

                        if (rowUser === user) {
                            userFound = true;
                            if (rowPass === pass) {
                                passwordCorrect = true;
                            }
                            break; // Stop searching once username is found
                        }
                    }

                    if (userFound && passwordCorrect) {
                        // Success: Save session and Redirect
                        sessionStorage.setItem('isLoggedIn', 'true');
                        window.location.href = 'index.html';
                    } else {
                        // Failure: Determine specific error
                        let specificError = "";
                        if (!userFound) {
                            specificError = "Could not find an account matching that username.";
                        } else {
                            specificError = "The password you entered is incorrect.";
                        }

                        // Professional Contact Message (Singular)
                        const contactMsg = "<br><span style='font-size: 0.85rem; opacity: 0.9; display: block; margin-top: 8px; font-weight: 400;'>Please verify your credentials. If you believe this is a system error, kindly contact the developer.</span>";

                        errorMsg.innerHTML = `<div class="d-flex align-items-center justify-content-center mb-1"><i class="bi bi-exclamation-triangle-fill me-2"></i><strong>Access Denied</strong></div>${specificError}${contactMsg}`;
                        errorMsg.style.display = 'block';

                        // Reset Button
                        btn.disabled = false;
                        btnText.classList.remove('d-none');
                        btnSpinner.classList.add('d-none');
                    }
                },
                error: function(err) {
                    console.error("Error fetching CSV:", err);
                    errorMsg.innerHTML = `<i class="bi bi-wifi-off me-2"></i>Connection Error. Please check your internet and try again.`;
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btnText.classList.remove('d-none');
                    btnSpinner.classList.add('d-none');
                }
            });
        });
    </script>
</body>
</html>
