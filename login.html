<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="naruto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Health Screening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
        (function() {
            var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXwIRlW7pGXqc3TkgWm4G5prkILVG5mSFPXve0j8wczUOrcrSaocW2JDzju5shK2nDEMmk7UJJylbm/pub?gid=263939704&single=true&output=csv";
            function checkAndRedirect() {
                var apiUrl = localStorage.getItem('healthScreening_API');
                function handleResult(m) { if (m) window.location.replace('maintenance.html'); }
                function csvFallback() {
                    Papa.parse(CSV_URL, { download:true, header:true,
                        complete: function(r) { var s=''; if(r.data&&r.data.length>0){var row=r.data[0];s=row.Status||row.status||row.Maintenance||row.maintenance||Object.values(row)[0]||'';} handleResult(s.toString().toUpperCase()==='ON'||s.toString().toUpperCase()==='TRUE'); },
                        error: function(){}
                    });
                }
                if(apiUrl){fetch(apiUrl+'?checkMaintenance=true').then(function(r){return r.json();}).then(function(res){handleResult(res.maintenance===true);}).catch(csvFallback);}else{csvFallback();}
            }
            checkAndRedirect(); setInterval(checkAndRedirect,30000);
        })();
    </script>

    <style>
        :root {
            --naruto-orange: #FF8C00;
            --naruto-orange-dark: #E67600;
            --leaf-green: #2E5A2B;
            --leaf-green-light: #4A7C3F;
            --clay-bg: #F4F1E1;
            --wood-dark: #5C4033;
            --wood-light: #8B6914;
            --shadow-color: #1a1a2e;
            --text-dark: #2F2E2E;
            --text-light: #F5F5DC;
            --scroll-bg: #FFF8E7;
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 32px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        @keyframes cloudsFloat {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes blobDrift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            40% { transform: translate(30px, -25px) scale(1.05); }
            70% { transform: translate(-20px, 15px) scale(0.97); }
        }

        body {
            font-family: 'Poppins', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a2b 30%, #8B7355 80%, #D2B48C 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            animation: fadeIn .8s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        body::before {
            content: "☁️";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            font-size: 120px;
            white-space: nowrap;
            color: rgba(255,255,240,0.08);
            animation: cloudsFloat 40s linear infinite;
            z-index: 0;
        }

        @keyframes spin-arc {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: .6; }
            50% { transform: scale(1.08); opacity: .25; }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideOutRight {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(40px); visibility: hidden; }
        }

        .toast-notification-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            pointer-events: none;
        }

        .login-toast {
            pointer-events: auto;
            background: var(--scroll-bg);
            border: 2px solid var(--wood-dark);
            border-left: 4px solid #ef4444;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            padding: 16px 20px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            animation: slideInRight 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
            transition: all 0.2s ease;
            width: 100%;
        }
        .login-toast.hiding {
            animation: slideOutRight 0.3s ease-in forwards;
        }
        .toast-icon {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            background: rgba(239,68,68,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f87171;
            font-size: 1.2rem;
        }
        .toast-content {
            flex: 1;
        }
        .toast-title {
            font-weight: 800;
            font-size: 0.9rem;
            color: #dc2626;
            margin-bottom: 4px;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toast-message {
            font-size: 0.82rem;
            color: #5a4a3a;
            line-height: 1.45;
            margin-bottom: 8px;
        }
        .toast-detail {
            font-size: 0.7rem;
            color: var(--wood-light);
            display: flex;
            align-items: center;
            gap: 6px;
            border-top: 1px solid rgba(92,64,51,0.15);
            padding-top: 8px;
            margin-top: 4px;
        }
        .toast-detail i {
            font-size: 0.7rem;
            color: var(--naruto-orange);
        }
        .toast-close {
            background: transparent;
            border: none;
            color: var(--wood-light);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            margin-left: 8px;
            transition: color 0.2s;
            line-height: 1;
        }
        .toast-close:hover {
            color: var(--wood-dark);
        }

        .login-wrap {
            position: relative; z-index: 10;
            width: 100%; max-width: 480px;
            padding: 20px;
            animation: fadeIn .85s cubic-bezier(.23,1,.32,1) both;
        }

        .login-card {
            background: var(--scroll-bg);
            background-image: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 28px,
                rgba(139, 69, 19, 0.04) 28px,
                rgba(139, 69, 19, 0.04) 32px
            );
            border: none;
            border-radius: 0;
            padding: 56px 40px 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
            position: relative;
            overflow: visible;
        }

        /* Ninja Scroll Rolled Ends */
        .login-card::before {
            content: '';
            position: absolute;
            top: -14px; left: -4px; right: -4px;
            height: 28px;
            background: linear-gradient(to bottom, var(--wood-dark), #8B6914 20%, var(--wood-light) 40%, #8B6914 60%, var(--wood-dark));
            border-radius: 14px;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,200,150,0.2);
            z-index: 2;
        }
        .login-card::after {
            content: '';
            position: absolute;
            bottom: -14px; left: -4px; right: -4px;
            height: 28px;
            background: linear-gradient(to top, var(--wood-dark), #8B6914 20%, var(--wood-light) 40%, #8B6914 60%, var(--wood-dark));
            border-radius: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 -2px 4px rgba(255,200,150,0.2);
            z-index: 2;
        }

        /* Scroll side edges */
        .login-card .scroll-edge-l,
        .login-card .scroll-edge-r {
            position: absolute;
            top: 0; bottom: 0;
            width: 16px;
            background: linear-gradient(to right, transparent 0%, rgba(92,64,51,0.08) 40%, rgba(92,64,51,0.08) 60%, transparent 100%);
            pointer-events: none;
            z-index: 1;
        }
        .login-card .scroll-edge-l { left: 0; }
        .login-card .scroll-edge-r { right: 0; }

        /* Binding cord */
        .login-card .scroll-cord {
            position: absolute;
            left: 50%; transform: translateX(-50%);
            width: 40px; height: 6px;
            background: var(--naruto-orange);
            border-radius: 3px;
            box-shadow: 0 0 4px rgba(255,140,0,0.3);
            z-index: 3;
        }
        .login-card .scroll-cord-top {
            top: -8px;
        }
        .login-card .scroll-cord-bot {
            bottom: -8px;
        }

        /* Ninja seal stamp */
        .login-card .ninja-seal {
            position: absolute;
            top: 18px; right: 18px;
            width: 50px; height: 50px;
            border: 2px solid var(--naruto-orange);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--naruto-orange);
            font-size: 1.1rem;
            opacity: 0.4;
            transform: rotate(8deg);
            pointer-events: none;
            z-index: 1;
        }
        .login-card .ninja-seal::after {
            content: '';
            position: absolute;
            inset: 3px;
            border: 1px solid var(--naruto-orange);
            border-radius: 2px;
            opacity: 0.6;
        }

        .icon-wrap {
            position: relative;
            width: 100px; height: 100px;
            margin: 0 auto 36px;
        }
        .icon-ring {
            position: absolute; inset: -8px; border-radius: 50%;
            border: 2px solid rgba(255,140,0,0.4);
            animation: pulse-ring 3s ease-in-out infinite;
        }
        .icon-ring-2 {
            position: absolute; inset: -18px; border-radius: 50%;
            border: 1px solid rgba(255,140,0,0.15);
            animation: pulse-ring 3s 1.2s ease-in-out infinite;
        }
        .icon-arc {
            position: absolute; inset: -4px; border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--naruto-orange);
            border-right-color: rgba(255,140,0,0.3);
            animation: spin-arc 3s linear infinite;
        }
        .icon-circle {
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, var(--leaf-green), var(--wood-dark));
            border: 2px solid var(--naruto-orange);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.8rem; color: var(--naruto-orange);
            animation: float 6s ease-in-out infinite;
            box-shadow: 0 8px 32px rgba(255,140,0,0.25);
        }

        .brand-label {
            text-align: center;
            font-size: .7rem; font-weight: 800;
            letter-spacing: .18em; text-transform: uppercase;
            background: linear-gradient(135deg, var(--naruto-orange), var(--leaf-green-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        h2.login-title {
            text-align: center;
            font-size: 2.2rem; font-weight: 900;
            color: var(--wood-dark); margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .login-sub {
            text-align: center;
            font-size: .9rem; color: #5a4a3a;
            margin-bottom: 32px; line-height: 1.6;
        }

        .form-divider {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 28px; color: var(--wood-dark); font-size: .75rem; font-weight: 700;
            letter-spacing: 0.08em;
        }
        .form-divider::before, .form-divider::after {
            content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(92,64,51,0.2), transparent);
        }

        .field-wrap { margin-bottom: 20px; position: relative; }
        .field-label {
            display: block;
            font-size: .75rem; font-weight: 700;
            letter-spacing: .08em; text-transform: uppercase;
            color: var(--wood-dark); margin-bottom: 10px;
        }
        .field-inner { position: relative; }
        .field-icon {
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            color: var(--wood-light); font-size: 1.1rem;
            transition: all .3s;
            z-index: 10;
        }
        .toggle-password {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            color: #475569; font-size: 1.1rem;
            cursor: pointer;
            transition: color .3s;
            z-index: 10;
        }
        .toggle-password:hover { color: var(--naruto-orange); }
        .field-inner:focus-within .field-icon { 
            color: var(--naruto-orange); 
            text-shadow: 0 0 12px rgba(255,140,0,0.5);
        }

        .form-control {
            width: 100%;
            background: rgba(244, 241, 225, 0.85);
            border: 2px solid var(--wood-dark);
            border-radius: 16px;
            color: var(--text-dark);
            padding: 15px 18px 15px 48px;
            font-family: 'Poppins', 'Cairo', sans-serif;
            font-size: 1rem;
            transition: all .3s;
            outline: none;
        }
        .form-control::placeholder { color: var(--wood-light); }
        .form-control:focus {
            background: #FFF8E7;
            border-color: var(--naruto-orange);
            box-shadow: 0 0 0 4px rgba(255,140,0,0.15), 0 8px 24px rgba(0,0,0,0.1);
            color: var(--text-dark);
        }

        .btn-login {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, var(--naruto-orange), var(--naruto-orange-dark));
            border: none; border-radius: 16px;
            color: #fff; font-family: 'Poppins', 'Cairo', sans-serif;
            font-size: 1.05rem; font-weight: 800;
            cursor: pointer; margin-top: 12px;
            transition: all .35s;
            box-shadow: 0 8px 24px rgba(255,140,0,0.3);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 16px 36px rgba(255,140,0,0.45);
        }
        .btn-login:active:not(:disabled) { transform: translateY(-1px); }
        .btn-login:disabled { opacity: .7; cursor: not-allowed; }

        .spinner-border { width: 1.3rem; height: 1.3rem; border-width: 2px; }

        .login-footer {
            text-align: center; margin-top: 24px;
            font-size: .72rem; color: var(--wood-dark);
        }

        .error-box { display: none; }

        .btn-rasengan {
            display: inline-flex; align-items: center; gap: 10px;
            background: linear-gradient(135deg, var(--naruto-orange), var(--naruto-orange-dark));
            border: none; padding: 12px 32px;
            border-radius: 40px; color: white;
            font-weight: 800; font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(255,140,0,0.4);
            transition: all 0.35s; text-decoration: none;
        }
        .btn-rasengan:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 25px rgba(255,140,0,0.6);
            color: white;
        }
        .btn-konoha {
            display: inline-flex; align-items: center; gap: 10px;
            background: rgba(92, 64, 51, 0.8);
            border: 1px solid var(--naruto-orange);
            padding: 12px 32px; border-radius: 40px;
            color: var(--text-light); font-weight: 800; font-size: 0.9rem;
            transition: all 0.35s; text-decoration: none;
        }
        .btn-konoha:hover {
            background: rgba(255, 140, 0, 0.3);
            border-color: var(--naruto-orange);
            color: var(--naruto-orange);
            transform: translateY(-4px);
        }
    </style>

</head>
<body class="page-login">

    <!-- Toast Notifications Container (top right) -->
    <div class="toast-notification-container" id="toastContainer"></div>

    <div class="login-wrap">
        <div class="login-card">

            <!-- Scroll decorative elements -->
            <div class="scroll-edge-l"></div>
            <div class="scroll-edge-r"></div>
            <div class="scroll-cord scroll-cord-top"></div>
            <div class="scroll-cord scroll-cord-bot"></div>
            <div class="ninja-seal">🍃</div>

            <!-- Icon -->
            <div class="icon-wrap">
                <div class="icon-circle"><i class="bi bi-shield-lock-fill"></i></div>
            </div>

            <!-- Heading -->
            <div class="brand-label"><i class="bi bi-activity me-1"></i> Health Screening</div>
            <h2 class="login-title">Welcome Back</h2>
            <p class="login-sub">Enter your credentials to access the dashboard</p>

            <div class="form-divider">Secure Login</div>

            <!-- Form -->
            <form id="loginForm" autocomplete="off">

                <div class="field-wrap">
                    <label class="field-label" for="username">Username</label>
                    <div class="field-inner">
                        <i class="bi bi-person-fill field-icon"></i>
                        <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
                    </div>
                </div>

                <div class="field-wrap">
                    <label class="field-label" for="password">Password</label>
                    <div class="field-inner">
                        <i class="bi bi-lock-fill field-icon"></i>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                        <i class="bi bi-eye-fill toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="btnText"><i class="bi bi-box-arrow-in-right me-1"></i> Login</span>
                    <span id="btnSpinner" class="spinner-border text-white d-none" role="status"></span>
                </button>

                <div class="error-box" id="errorMsg"></div>

            </form>

             <p class="text-center mb-0" style="font-size:0.8rem;color:var(--wood-dark);padding-bottom:10px;">&copy; 2026 Health Screening Project. All rights reserved. | Developed by Dr. Mamdouh Abd Elaziz</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if (sessionStorage.getItem('isLoggedIn') === 'true') window.location.href = 'index.html';

        const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vROSvg9xVSBLkqDfzLCKOr0Fvb0k_CeAQT9PDQHJMWDCmjYswPUSjXmE0YkfX836Npy0ivzOY5y8iIZ/pub?gid=0&single=true&output=csv";

        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('bi-eye-fill');
            this.classList.toggle('bi-eye-slash-fill');
        });

        // Toast notification manager
        const toastContainer = document.getElementById('toastContainer');

        function showErrorToast(title, mainMessage, detailedHint = null) {
            // Create toast element
            const toast = document.createElement('div');
            toast.className = 'login-toast';

            // Determine icon based on error type
            let iconHtml = '<i class="bi bi-exclamation-triangle-fill"></i>';

            const content = `
                <div class="toast-icon">
                    ${iconHtml}
                </div>
                <div class="toast-content">
                    <div class="toast-title">
                        <i class="bi bi-shield-exclamation"></i> ${escapeHtml(title)}
                    </div>
                    <div class="toast-message">
                        ${escapeHtml(mainMessage)}
                    </div>
                    ${detailedHint ? `<div class="toast-detail">
                        <i class="bi bi-chat-dots"></i> ${escapeHtml(detailedHint)}
                    </div>` : ''}
                </div>
                <button class="toast-close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
            `;
            toast.innerHTML = content;

            // Close button functionality
            const closeBtn = toast.querySelector('.toast-close');
            closeBtn.addEventListener('click', () => {
                removeToast(toast);
            });

            toastContainer.appendChild(toast);

            // Auto remove after 6 seconds
            setTimeout(() => {
                removeToast(toast);
            }, 6000);
        }

        function removeToast(toastElement) {
            if (toastElement.classList.contains('hiding')) return;
            toastElement.classList.add('hiding');
            setTimeout(() => {
                if (toastElement.parentNode) toastElement.remove();
            }, 300);
        }

        // simple escape to prevent XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }

        // Clear any existing toasts (optional when new login attempt, but we keep)
        function clearAllToasts() {
            const toasts = document.querySelectorAll('.login-toast');
            toasts.forEach(toast => removeToast(toast));
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const user    = document.getElementById('username').value.trim();
            const pass    = document.getElementById('password').value.trim();
            const btn     = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            // Basic validation: empty fields
            if (!user || !pass) {
                let missingFields = [];
                if (!user) missingFields.push("Username");
                if (!pass) missingFields.push("Password");
                let fieldMsg = missingFields.join(" and ");
                showErrorToast(
                    "Missing Credentials",
                    `Please fill in ${fieldMsg}.`,
                    "Both username and password are required to log in."
                );
                return;
            }

            btn.disabled = true;
            btnText.classList.add('d-none');
            spinner.classList.remove('d-none');

            Papa.parse(sheetURL, {
                download: true, header: true,
                complete: function(results) {
                    const data = results.data;
                    let userFound = false;
                    let passwordMatched = false;
                    let storedPassword = "";

                    // Loop to find username
                    for (let i = 0; i < data.length; i++) {
                        const ru = (data[i].username || '').toString().trim();
                        const rp = (data[i].password || '').toString().trim();
                        if (ru === user) {
                            userFound = true;
                            storedPassword = rp;
                            if (rp === pass) {
                                passwordMatched = true;
                            }
                            break;
                        }
                    }

                    // Success case
                    if (userFound && passwordMatched) {
                        sessionStorage.setItem('isLoggedIn', 'true');
                        sessionStorage.setItem('userName', user);
                        window.location.href = 'index.html';
                        return;
                    }

                    // Determine exact error scenario
                    let errorTitle = "Access Denied";
                    let errorMessage = "";
                    let errorHint = "If you believe this is a system error, kindly contact the developer.";

                    if (!userFound) {
                        errorMessage = "The username you entered does not exist in our records.";
                        // custom hint: explain it's username specific
                        errorHint = "Check your username spelling or contact support. If you need assistance, reach out to the developer.";
                    }
                    else if (userFound && !passwordMatched) {
                        errorMessage = "Incorrect password for this account.";
                        errorHint = "Double-check your password or reset it via admin. For any issue, contact the developer.";
                    }
                    else {
                        // fallback (should not happen)
                        errorMessage = "Invalid credentials. Please verify your username and password.";
                    }

                    // Show toast notification
                    showErrorToast(errorTitle, errorMessage, errorHint);

                    // Reset button state
                    btn.disabled = false;
                    btnText.classList.remove('d-none');
                    spinner.classList.add('d-none');
                },
                error: function(err) {
                    console.error("CSV Load Error", err);
                    showErrorToast(
                        "Connection Error",
                        "Unable to reach authentication server. Please check your internet connection.",
                        "If the problem persists, contact the developer for assistance."
                    );
                    btn.disabled = false;
                    btnText.classList.remove('d-none');
                    spinner.classList.add('d-none');
                }
            });
        });
    </script>
    <script src="sound-effects.js"></script>
</body>
</html>
