<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Health Screening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
        (function() {
            var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXwIRlW7pGXqc3TkgWm4G5prkILVG5mSFPXve0j8wczUOrcrSaocW2JDzju5shK2nDEMmk7UJJylbm/pub?gid=263939704&single=true&output=csv";
            function checkAndRedirect() {
                var apiUrl = localStorage.getItem('healthScreening_API');
                function handleResult(m) { if (m) window.location.replace('maintenance.html'); }
                function csvFallback() {
                    Papa.parse(CSV_URL, { download:true, header:true,
                        complete: function(r) { var s=''; if(r.data&&r.data.length>0){var row=r.data[0];s=row.Status||row.status||row.Maintenance||row.maintenance||Object.values(row)[0]||'';} handleResult(s.toString().toUpperCase()==='ON'||s.toString().toUpperCase()==='TRUE'); },
                        error: function(){}
                    });
                }
                if(apiUrl){fetch(apiUrl+'?checkMaintenance=true').then(function(r){return r.json();}).then(function(res){handleResult(res.maintenance===true);}).catch(csvFallback);}else{csvFallback();}
            }
            checkAndRedirect(); setInterval(checkAndRedirect,30000);
        })();
    </script>

    <style>
        :root {
            --main-gradient: linear-gradient(120deg, #2563eb, #06b6d4, #10b981);
            --bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.65);
            --border: rgba(255, 255, 255, 0.07);
            --text: #f1f5f9;
            --muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-12px); }
        }
        @keyframes spin-arc {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes pulse-ring {
            0%, 100% { transform: scale(1);    opacity: .6; }
            50%       { transform: scale(1.08); opacity: .25; }
        }
        @keyframes blobMove {
            0%, 100% { transform: translate(0,0) scale(1); }
            33%       { transform: translate(30px,-20px) scale(1.05); }
            66%       { transform: translate(-20px,15px) scale(.97); }
        }
        /* Notification slide animation */
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes slideOutRight {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(40px);
                visibility: hidden;
            }
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .18;
            pointer-events: none;
            animation: blobMove 14s ease-in-out infinite;
        }
        .blob-1 { width: 520px; height: 520px; background: #2563eb; top: -15%; left: -12%; animation-delay: 0s; }
        .blob-2 { width: 400px; height: 400px; background: #06b6d4; bottom: -12%; right: -8%; animation-delay: 5s; }
        .blob-3 { width: 280px; height: 280px; background: #10b981; top: 55%; left: 55%; animation-delay: 9s; }

        /* Grid */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none; z-index: 0;
        }

        /* Toast Notification Container (top-right) */
        .toast-notification-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            pointer-events: none;
        }

        /* Individual Toast */
        .login-toast {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border-left: 4px solid #ef4444;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 0 1px rgba(239,68,68,0.2);
            padding: 16px 20px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            animation: slideInRight 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
            transition: all 0.2s ease;
            width: 100%;
        }
        .login-toast.hiding {
            animation: slideOutRight 0.3s ease-in forwards;
        }
        .toast-icon {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            background: rgba(239,68,68,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f87171;
            font-size: 1.2rem;
        }
        .toast-content {
            flex: 1;
        }
        .toast-title {
            font-weight: 800;
            font-size: 0.9rem;
            color: #fca5a5;
            margin-bottom: 4px;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toast-message {
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.45;
            margin-bottom: 8px;
        }
        .toast-detail {
            font-size: 0.7rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 8px;
            margin-top: 4px;
        }
        .toast-detail i {
            font-size: 0.7rem;
            color: #60a5fa;
        }
        .toast-close {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            margin-left: 8px;
            transition: color 0.2s;
            line-height: 1;
        }
        .toast-close:hover {
            color: #f1f5f9;
        }

        /* Card */
        .login-wrap {
            position: relative; z-index: 10;
            width: 100%; max-width: 460px;
            padding: 20px;
            animation: fadeIn .85s cubic-bezier(.23,1,.32,1) both;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 52px 44px 44px;
            box-shadow: 0 40px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);
            position: relative;
            overflow: hidden;
        }

        /* top gradient line */
        .login-card::before {
            content: '';
            position: absolute; top: 0; left: 15%; right: 15%; height: 2px;
            background: var(--main-gradient);
            border-radius: 100%;
        }

        /* Icon */
        .icon-wrap {
            position: relative;
            width: 96px; height: 96px;
            margin: 0 auto 32px;
        }
        .icon-ring {
            position: absolute; inset: -10px; border-radius: 50%;
            border: 1.5px solid rgba(6,182,212,.3);
            animation: pulse-ring 3s ease-in-out infinite;
        }
        .icon-ring-2 {
            position: absolute; inset: -22px; border-radius: 50%;
            border: 1px solid rgba(6,182,212,.12);
            animation: pulse-ring 3s 1.2s ease-in-out infinite;
        }
        .icon-arc {
            position: absolute; inset: -6px; border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #06b6d4;
            border-right-color: rgba(6,182,212,.25);
            animation: spin-arc 3.5s linear infinite;
        }
        .icon-circle {
            width: 96px; height: 96px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(37,99,235,.15), rgba(6,182,212,.15));
            border: 1px solid rgba(6,182,212,.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; color: #22d3ee;
            animation: float 6s ease-in-out infinite;
        }

        /* Brand label */
        .brand-label {
            text-align: center;
            font-size: .75rem; font-weight: 700;
            letter-spacing: .12em; text-transform: uppercase;
            background: var(--main-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        h2.login-title {
            text-align: center;
            font-size: 2rem; font-weight: 900;
            color: var(--text); margin-bottom: 6px;
        }

        .login-sub {
            text-align: center;
            font-size: .9rem; color: var(--muted);
            margin-bottom: 36px; line-height: 1.6;
        }

        /* Divider */
        .form-divider {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 24px; color: #1e293b; font-size: .78rem; font-weight: 600;
        }
        .form-divider::before, .form-divider::after {
            content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.06);
        }

        /* Fields */
        .field-wrap { margin-bottom: 20px; }

        .field-label {
            display: block;
            font-size: .78rem; font-weight: 700;
            letter-spacing: .06em; text-transform: uppercase;
            color: #475569; margin-bottom: 8px;
        }

        .field-inner {
            position: relative;
        }
        .field-icon {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: #334155; font-size: 1rem;
            transition: color .25s;
        }
        .field-inner:focus-within .field-icon { color: #22d3ee; }

        .form-control {
            width: 100%;
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 14px;
            color: var(--text);
            padding: 13px 16px 13px 44px;
            font-family: 'Cairo', sans-serif;
            font-size: .95rem;
            transition: all .25s;
            outline: none;
        }
        .form-control::placeholder { color: #334155; }
        .form-control:focus {
            background: rgba(2, 6, 23, 0.85);
            border-color: rgba(6,182,212,.4);
            box-shadow: 0 0 0 3px rgba(6,182,212,.1);
            color: var(--text);
        }

        /* Login button */
        .btn-login {
            width: 100%; padding: 14px;
            background: var(--main-gradient);
            border: none; border-radius: 14px;
            color: #fff; font-family: 'Cairo', sans-serif;
            font-size: 1rem; font-weight: 800;
            cursor: pointer; margin-top: 8px;
            transition: all .3s;
            box-shadow: 0 6px 20px rgba(6,182,212,.25);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(6,182,212,.4);
        }
        .btn-login:active:not(:disabled) { transform: translateY(0); }
        .btn-login:disabled { opacity: .65; cursor: not-allowed; }

        .spinner-border { width: 1.3rem; height: 1.3rem; border-width: 2px; }

        /* Footer note */
        .login-footer {
            text-align: center; margin-top: 28px;
            font-size: .75rem; color: #1e293b;
        }

        /* original error box hidden (replaced by toast) */
        .error-box {
            display: none;
        }
    </style>
        <link rel="stylesheet" href="claymorphism.css">
</head>
<body class="page-login">

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Toast Notifications Container (top right) -->
    <div class="toast-notification-container" id="toastContainer"></div>

    <div class="login-wrap">
        <div class="login-card">

            <!-- Icon -->
            <div class="icon-wrap">
                <div class="icon-ring-2"></div>
                <div class="icon-ring"></div>
                <div class="icon-arc"></div>
                <div class="icon-circle"><i class="bi bi-shield-lock-fill"></i></div>
            </div>

            <!-- Heading -->
            <div class="brand-label"><i class="bi bi-activity me-1"></i> Health Screening</div>
            <h2 class="login-title">Welcome Back</h2>
            <p class="login-sub">Enter your credentials to access the dashboard</p>

            <div class="form-divider">Secure Login</div>

            <!-- Form -->
            <form id="loginForm" autocomplete="off">

                <div class="field-wrap">
                    <label class="field-label" for="username">Username</label>
                    <div class="field-inner">
                        <i class="bi bi-person-fill field-icon"></i>
                        <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
                    </div>
                </div>

                <div class="field-wrap">
                    <label class="field-label" for="password">Password</label>
                    <div class="field-inner">
                        <i class="bi bi-lock-fill field-icon"></i>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="btnText"><i class="bi bi-box-arrow-in-right me-1"></i> Login</span>
                    <span id="btnSpinner" class="spinner-border text-white d-none" role="status"></span>
                </button>

                <!-- hidden old error box (replaced by modern toasts) -->
                <div class="error-box" id="errorMsg"></div>

            </form>

             <p class="text-center mb-0" style="font-size:0.8rem;color:#ffffff;">&copy; 2026 Health Screening Project. All rights reserved. | Developed by Dr. Mamdouh Abd Elaziz</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if (sessionStorage.getItem('isLoggedIn') === 'true') window.location.href = 'index.html';

        const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vROSvg9xVSBLkqDfzLCKOr0Fvb0k_CeAQT9PDQHJMWDCmjYswPUSjXmE0YkfX836Npy0ivzOY5y8iIZ/pub?gid=0&single=true&output=csv";

        // Toast notification manager
        const toastContainer = document.getElementById('toastContainer');

        function showErrorToast(title, mainMessage, detailedHint = null) {
            // Create toast element
            const toast = document.createElement('div');
            toast.className = 'login-toast';

            // Determine icon based on error type
            let iconHtml = '<i class="bi bi-exclamation-triangle-fill"></i>';

            const content = `
                <div class="toast-icon">
                    ${iconHtml}
                </div>
                <div class="toast-content">
                    <div class="toast-title">
                        <i class="bi bi-shield-exclamation"></i> ${escapeHtml(title)}
                    </div>
                    <div class="toast-message">
                        ${escapeHtml(mainMessage)}
                    </div>
                    ${detailedHint ? `<div class="toast-detail">
                        <i class="bi bi-chat-dots"></i> ${escapeHtml(detailedHint)}
                    </div>` : ''}
                </div>
                <button class="toast-close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
            `;
            toast.innerHTML = content;

            // Close button functionality
            const closeBtn = toast.querySelector('.toast-close');
            closeBtn.addEventListener('click', () => {
                removeToast(toast);
            });

            toastContainer.appendChild(toast);

            // Auto remove after 6 seconds
            setTimeout(() => {
                removeToast(toast);
            }, 6000);
        }

        function removeToast(toastElement) {
            if (toastElement.classList.contains('hiding')) return;
            toastElement.classList.add('hiding');
            setTimeout(() => {
                if (toastElement.parentNode) toastElement.remove();
            }, 300);
        }

        // simple escape to prevent XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }

        // Clear any existing toasts (optional when new login attempt, but we keep)
        function clearAllToasts() {
            const toasts = document.querySelectorAll('.login-toast');
            toasts.forEach(toast => removeToast(toast));
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const user    = document.getElementById('username').value.trim();
            const pass    = document.getElementById('password').value.trim();
            const btn     = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            // Basic validation: empty fields
            if (!user || !pass) {
                let missingFields = [];
                if (!user) missingFields.push("Username");
                if (!pass) missingFields.push("Password");
                let fieldMsg = missingFields.join(" and ");
                showErrorToast(
                    "Missing Credentials",
                    `Please fill in ${fieldMsg}.`,
                    "Both username and password are required to log in."
                );
                return;
            }

            btn.disabled = true;
            btnText.classList.add('d-none');
            spinner.classList.remove('d-none');

            Papa.parse(sheetURL, {
                download: true, header: true,
                complete: function(results) {
                    const data = results.data;
                    let userFound = false;
                    let passwordMatched = false;
                    let storedPassword = "";

                    // Loop to find username
                    for (let i = 0; i < data.length; i++) {
                        const ru = (data[i].username || '').toString().trim();
                        const rp = (data[i].password || '').toString().trim();
                        if (ru === user) {
                            userFound = true;
                            storedPassword = rp;
                            if (rp === pass) {
                                passwordMatched = true;
                            }
                            break;
                        }
                    }

                    // Success case
                    if (userFound && passwordMatched) {
                        sessionStorage.setItem('isLoggedIn', 'true');
                        window.location.href = 'index.html';
                        return;
                    }

                    // Determine exact error scenario
                    let errorTitle = "Access Denied";
                    let errorMessage = "";
                    let errorHint = "If you believe this is a system error, kindly contact the developer.";

                    if (!userFound) {
                        errorMessage = "The username you entered does not exist in our records.";
                        // custom hint: explain it's username specific
                        errorHint = "Check your username spelling or contact support. If you need assistance, reach out to the developer.";
                    }
                    else if (userFound && !passwordMatched) {
                        errorMessage = "Incorrect password for this account.";
                        errorHint = "Double-check your password or reset it via admin. For any issue, contact the developer.";
                    }
                    else {
                        // fallback (should not happen)
                        errorMessage = "Invalid credentials. Please verify your username and password.";
                    }

                    // Show toast notification
                    showErrorToast(errorTitle, errorMessage, errorHint);

                    // Reset button state
                    btn.disabled = false;
                    btnText.classList.remove('d-none');
                    spinner.classList.add('d-none');
                },
                error: function(err) {
                    console.error("CSV Load Error", err);
                    showErrorToast(
                        "Connection Error",
                        "Unable to reach authentication server. Please check your internet connection.",
                        "If the problem persists, contact the developer for assistance."
                    );
                    btn.disabled = false;
                    btnText.classList.remove('d-none');
                    spinner.classList.add('d-none');
                }
            });
        });
    </script>
    <script src="sound-effects.js"></script>
</body>
</html>
