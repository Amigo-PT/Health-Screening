<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="naruto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Health Screening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --naruto-orange: #FF8C00;
            --naruto-orange-dark: #E67600;
            --leaf-green: #2E5A2B;
            --leaf-green-light: #4A7C3F;
            --clay-bg: #F4F1E1;
            --wood-dark: #5C4033;
            --wood-light: #8B6914;
            --shadow-color: #1a1a2e;
            --text-dark: #2F2E2E;
            --text-light: #F5F5DC;
            --scroll-bg: #FFF8E7;
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 32px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        @keyframes cloudsFloat {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes blobDrift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            40% { transform: translate(30px, -25px) scale(1.05); }
            70% { transform: translate(-20px, 15px) scale(0.97); }
        }

        body {
            margin: 0;
            font-family: 'Poppins', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a2b 30%, #8B7355 80%, #D2B48C 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            animation: fadeIn .8s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        body::before {
            content: "☁️";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            font-size: 120px;
            white-space: nowrap;
            color: rgba(255,255,240,0.08);
            animation: cloudsFloat 40s linear infinite;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.05); }
        }

        .page-shell {
            width: min(100%, 1100px);
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 36px;
            box-shadow: 0 50px 120px rgba(0,0,0,0.45);
            overflow: hidden;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s cubic-bezier(0.23,1,0.32,1) both;
        }
        .page-shell::before {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%; height: 2px;
            background: linear-gradient(135deg, var(--naruto-orange), var(--leaf-green-light));
            border-radius: 100%;
        }
        .page-shell::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,140,0,0.05), transparent 40%, rgba(255,140,0,0.03));
            pointer-events: none;
        }

        .hero {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 3rem;
            padding: 60px 50px;
            position: relative;
            z-index: 1;
            align-items: center;
        }

        @media(max-width: 900px) {
            .hero { grid-template-columns: 1fr; padding: 40px 28px; text-align: center; }
            .actions { justify-content: center; }
        }

        .hero-copy {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(255,140,0,0.1);
            border: 1px solid rgba(255,140,0,0.25);
            color: var(--naruto-orange);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.8rem;
            width: fit-content;
        }

        .title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: #ffffff;
        }
        .title span {
            color: var(--naruto-orange);
        }

        .description {
            max-width: 520px;
            font-size: 1.05rem;
            line-height: 1.8;
            color: #94a3b8;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 12px;
        }

        .btn-primary,
        .btn-secondary {
            min-width: 160px;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.23,1,0.32,1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--naruto-orange), var(--naruto-orange-dark));
            border: none;
            color: #fff;
            box-shadow: 0 8px 25px rgba(255,140,0,0.3);
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255,140,0,0.45);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            color: #f1f5f9;
        }
        .btn-secondary:hover {
            background: rgba(255,140,0,0.1);
            border-color: rgba(255,140,0,0.3);
            color: var(--naruto-orange);
            transform: translateY(-3px);
        }

        .hero-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .visual-card {
            width: 220px;
            height: 220px;
            background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(255,140,0,0.08));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }
        .visual-card::before {
            content: '';
            position: absolute;
            width: 140px;
            height: 140px;
            border: 2px solid rgba(255,140,0,0.2);
            border-radius: 50%;
            animation: pulse 3s ease-in-out infinite;
        }
        .visual-icon {
            font-size: 4rem;
            color: var(--naruto-orange);
            animation: float 4s ease-in-out infinite;
        }

        .visual-card-2 {
            width: 160px;
            height: 160px;
            background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(255,140,0,0.08));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .visual-icon-2 {
            font-size: 3rem;
            background: linear-gradient(135deg, var(--naruto-orange), var(--leaf-green-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 5s ease-in-out infinite 0.5s;
        }

        .footer-note {
            padding: 20px 28px 28px;
            background: rgba(2,6,23,0.6);
            border-top: 1px solid rgba(255,255,255,0.07);
            color: #94a3b8;
            text-align: center;
            font-size: 0.9rem;
        }
        .footer-note a {
            color: var(--naruto-orange);
            text-decoration: none;
            font-weight: 600;
        }
        .footer-note a:hover {
            text-decoration: underline;
        }

        .btn-rasengan {
            display: inline-flex; align-items: center; gap: 10px;
            background: linear-gradient(135deg, var(--naruto-orange), var(--naruto-orange-dark));
            border: none; padding: 12px 32px;
            border-radius: 40px; color: white;
            font-weight: 800; font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(255,140,0,0.4);
            transition: all 0.35s; text-decoration: none;
        }
        .btn-rasengan:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 25px rgba(255,140,0,0.6);
            color: white;
        }
        .btn-konoha {
            display: inline-flex; align-items: center; gap: 10px;
            background: rgba(92, 64, 51, 0.8);
            border: 1px solid var(--naruto-orange);
            padding: 12px 32px; border-radius: 40px;
            color: var(--text-light); font-weight: 800; font-size: 0.9rem;
            transition: all 0.35s; text-decoration: none;
        }
        .btn-konoha:hover {
            background: rgba(255, 140, 0, 0.3);
            border-color: var(--naruto-orange);
            color: var(--naruto-orange);
            transform: translateY(-4px);
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="hero">
            <div class="hero-copy">
                <span class="eyebrow"><i class="bi bi-wifi-off"></i> No Connection</span>
                <h1 class="title">You are currently <span>offline</span></h1>
                <p class="description">Don't worry! Your device has lost internet connection. Check your network settings and try again. Some cached pages may still be available.</p>
                <div class="actions">
                    <a href="javascript:location.reload()" class="btn btn-primary"><i class="bi bi-arrow-clockwise me-2"></i>Retry</a>
                    <a href="index.html" class="btn btn-secondary"><i class="bi bi-house-door me-2"></i>Go Home</a>
                </div>
            </div>
            <div class="hero-visual">
                <div class="visual-card">
                    <i class="bi bi-wifi-off visual-icon"></i>
                </div>
                <div class="visual-card-2">
                    <i class="bi bi-heart-pulse visual-icon-2"></i>
                </div>
            </div>
        </div>
        <div class="footer-note">
            Need help? <a href="index.html">Return to Home</a> or check your <a href="#">network settings</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sound-effects.js"></script>
    <script>
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
