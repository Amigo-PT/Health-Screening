<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Photos - Health Screening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
        // Maintenance Mode Check
        (function() {
            // Check session storage first
            if (sessionStorage.getItem('isLoggedIn') !== 'true') {
                 // Check if maintenance mode is enabled - NEW LINK
                 Papa.parse("https://docs.google.com/spreadsheets/d/e/2PACX-1vTXwIRlW7pGXqc3TkgWm4G5prkILVG5mSFPXve0j8wczUOrcrSaocW2JDzju5shK2nDEMmk7UJJylbm/pub?gid=263939704&single=true&output=csv", {
                    download: true,
                    header: true,
                    complete: function(results) {
                        if (results.data && results.data.length > 0) {
                            const row = results.data[0];
                            const status = row.Status || row.status || row.Maintenance || row.maintenance || Object.values(row)[0];
                            if (status && (status.toString().toUpperCase() === 'ON' || status.toString().toUpperCase() === 'TRUE')) {
                                window.location.href = 'maintenance.html';
                            } else {
                                // If not maintenance, check login
                                if (sessionStorage.getItem('isLoggedIn') !== 'true') {
                                    window.location.href = 'login.html';
                                }
                            }
                        } else {
                             // Fallback if sheet fails or is empty
                             if (sessionStorage.getItem('isLoggedIn') !== 'true') {
                                window.location.href = 'login.html';
                            }
                        }
                    },
                    error: function(err) {
                        console.error("Maintenance check failed", err);
                         // Fallback on error
                         if (sessionStorage.getItem('isLoggedIn') !== 'true') {
                            window.location.href = 'login.html';
                        }
                    }
                });
            }
        })();
    </script>

    <style>
        :root {
            --main-gradient: linear-gradient(120deg, #2563eb, #06b6d4, #10b981);
            --bg-body: #020617;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.6);
            --glass-border: 1px solid rgba(255, 255, 255, 0.07);
            --radius: 20px;
        }

        * { box-sizing: border-box; }

        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes zoomIn {
            from { transform: scale(0.93); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            background-color: var(--bg-body);
            background-image:
                radial-gradient(ellipse at 15% 10%, rgba(37, 99, 235, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 85%, rgba(16, 185, 129, 0.07) 0%, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeInPage 0.8s ease-out;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none; z-index: 0;
        }

        /* NAVBAR */
        .navbar {
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 16px 0;
            z-index: 100;
        }
        .navbar-brand {
            font-weight: 900; font-size: 1.3rem;
            background: var(--main-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 8px 18px;
            font-size: 0.88rem; font-weight: 700; color: var(--text-muted);
            text-decoration: none; transition: all 0.25s;
        }
        .back-btn:hover {
            background: rgba(6,182,212,0.1);
            border-color: rgba(6,182,212,0.25);
            color: #22d3ee;
            transform: translateX(-4px);
        }
        .back-btn i { transition: transform 0.25s; }
        .back-btn:hover i { transform: translateX(-3px); }

        /* HERO HEADER */
        .page-hero {
            position: relative; z-index: 1;
            padding: 140px 0 60px;
            text-align: center;
        }

        .hero-eyebrow {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(6,182,212,0.08);
            border: 1px solid rgba(6,182,212,0.2);
            border-radius: 50px; padding: 7px 18px;
            font-size: 0.8rem; font-weight: 700; color: #22d3ee;
            letter-spacing: 0.08em; text-transform: uppercase;
            margin-bottom: 20px;
        }

        .page-title {
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 900; line-height: 1.2;
            color: var(--text-main); margin-bottom: 16px;
        }

        .title-gradient {
            background: var(--main-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .desc-box {
            display: inline-block;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 18px 28px;
            font-size: 1rem; color: #cbd5e1;
            line-height: 1.75; max-width: 680px;
            margin-top: 8px;
        }

        /* STATS ROW */
        .stats-row {
            display: flex; justify-content: center; gap: 16px;
            flex-wrap: wrap; margin-top: 28px;
        }
        .stat-pill {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px; padding: 8px 20px;
            font-size: 0.85rem; font-weight: 700; color: var(--text-muted);
        }
        .stat-pill i { color: #06b6d4; }

        /* GALLERY GRID */
        .gallery-section { position: relative; z-index: 1; flex: 1; padding-bottom: 80px; }

        .photo-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            height: 100%;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            opacity: 0;
            animation: fadeInUp 0.7s forwards;
            position: relative;
        }
        .photo-card:hover {
            transform: translateY(-10px);
            border-color: rgba(6,182,212,0.3);
            box-shadow: 0 20px 50px -10px rgba(6, 182, 212, 0.2);
        }

        .photo-card .overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(2,6,23,0.7) 0%, transparent 50%);
            opacity: 0; transition: 0.4s; z-index: 2;
            display: flex; align-items: flex-end; padding: 20px;
        }
        .photo-card:hover .overlay { opacity: 1; }
        .overlay-icon {
            width: 40px; height: 40px; border-radius: 10px;
            background: rgba(6,182,212,0.2); border: 1px solid rgba(6,182,212,0.4);
            display: flex; align-items: center; justify-content: center;
            color: #22d3ee; font-size: 1.1rem;
        }

        .gallery-img {
            width: 100%; height: 260px;
            object-fit: cover;
            transition: transform 0.5s ease;
            display: block;
        }
        .photo-card:hover .gallery-img { transform: scale(1.07); }

        /* SKELETON */
        .skeleton {
            background: linear-gradient(90deg,
                rgba(255,255,255,0.04) 25%,
                rgba(255,255,255,0.08) 50%,
                rgba(255,255,255,0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite;
        }
        .skeleton-card {
            background: var(--card-bg); border: var(--glass-border);
            border-radius: var(--radius); overflow: hidden; height: 100%;
        }
        .skeleton-img { height: 260px; width: 100%; }

        /* EMPTY / ERROR STATE */
        .empty-state {
            text-align: center; padding: 80px 20px;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 4rem; opacity: 0.25; margin-bottom: 20px; display: block; }
        .empty-state h5 { color: #334155; margin-bottom: 8px; }
        .empty-state p { font-size: 0.9rem; color: #1e293b; }

        /* LIGHTBOX */
        .lightbox-modal {
            display: none;
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(2, 6, 23, 0.97);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            opacity: 0; transition: opacity 0.35s ease;
        }

        .lightbox-content-wrapper {
            position: relative;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }

        .lightbox-img {
            max-width: 92vw; max-height: 90vh;
            width: auto; height: auto;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 0 120px rgba(0,0,0,0.9);
            object-fit: contain;
            transition: opacity 0.2s, transform 0.2s;
            animation: zoomIn 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Lightbox controls */
        .lb-close {
            position: absolute; top: 20px; right: 24px; z-index: 2010;
            width: 52px; height: 52px; border-radius: 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            color: #94a3b8; font-size: 1.4rem; cursor: pointer;
            transition: all 0.3s; backdrop-filter: blur(10px);
        }
        .lb-close:hover { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.4); color: #fca5a5; transform: rotate(90deg); }

        .lb-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            z-index: 2010;
            width: 60px; height: 60px; border-radius: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            color: #94a3b8; font-size: 1.5rem; cursor: pointer;
            transition: all 0.3s; backdrop-filter: blur(10px);
        }
        .lb-nav:hover {
            background: rgba(6,182,212,0.15);
            border-color: rgba(6,182,212,0.35);
            color: #22d3ee;
            transform: translateY(-50%) scale(1.08);
        }
        .lb-prev { left: 20px; }
        .lb-next { right: 20px; }

        .lb-counter {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 2010;
            background: rgba(15,23,42,0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px; padding: 8px 24px;
            font-size: 0.9rem; font-weight: 700; color: #94a3b8;
            letter-spacing: 0.05em;
        }
        .lb-counter span { color: #22d3ee; }

        /* FOOTER */
        footer {
            position: relative; z-index: 1;
            background: #030712; color: #1e293b;
            padding: 32px 0;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        footer::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 2px; background: var(--main-gradient);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar fixed-top">
        <div class="container d-flex align-items-center justify-content-between">
            <a class="navbar-brand" href="index.html"><i class="bi bi-activity me-2"></i>Health Screening</a>
            <a class="back-btn" href="activities.html">
                <i class="bi bi-arrow-left"></i> Back to Activities
            </a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="page-hero">
        <div class="container">
            <div class="hero-eyebrow"><i class="bi bi-images"></i> Photo Gallery</div>
            <h1 class="page-title" id="activity-title">
                <span class="spinner-border spinner-border-sm text-info me-2" role="status"></span>Loading...
            </h1>
            <div id="activity-description"></div>
            <div class="stats-row" id="stats-row" style="display:none!important;">
                <div class="stat-pill"><i class="bi bi-images"></i> <span id="photo-count">0</span> Photos</div>
                <div class="stat-pill"><i class="bi bi-calendar3"></i> Activity Gallery</div>
            </div>
        </div>
    </section>

    <!-- Gallery -->
    <section class="gallery-section">
        <div class="container">
            <div class="row g-3" id="photos-container"></div>
            <div id="error-message"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="text-center mb-0" style="font-size:0.8rem;color:#ffffff;">&copy; 2026 Health Screening Project. All rights reserved. | Developed by Dr. Mamdouh Abd Elaziz</p>
        </div>
    </footer>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox-modal">
        <div class="lb-close" onclick="closeLightbox()"><i class="bi bi-x"></i></div>
        <div class="lb-nav lb-prev" onclick="changeImage(event,-1)"><i class="bi bi-chevron-left"></i></div>
        <div class="lb-nav lb-next" onclick="changeImage(event,1)"><i class="bi bi-chevron-right"></i></div>
        <div class="lightbox-content-wrapper" onclick="handleWrapperClick(event)">
            <img class="lightbox-img" id="lightbox-img" src="" alt="">
        </div>
        <div class="lb-counter"><span id="lb-current">1</span> / <span id="lb-total">1</span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentImageIndex = 0;
        let galleryImages = [];

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const title = params.get('title');
            const desc = params.get('desc');

            if (!title) { showError('Activity not specified.'); return; }

            showSkeletons();
            setTimeout(() => renderPage(title, desc), 800);

            document.addEventListener('keydown', e => {
                if (document.getElementById('lightbox').style.display === 'block') {
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') changeImage(e, -1);
                    if (e.key === 'ArrowRight') changeImage(e, 1);
                }
            });
        });

        function showSkeletons() {
            const c = document.getElementById('photos-container');
            c.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                c.innerHTML += `<div class="col-md-6 col-lg-4"><div class="skeleton-card"><div class="skeleton skeleton-img"></div></div></div>`;
            }
        }

        function renderPage(title, description) {
            // Title
            const titleEl = document.getElementById('activity-title');
            titleEl.innerHTML = `<span class="title-gradient">${title}</span>`;

            // Description
            if (description) {
                document.getElementById('activity-description').innerHTML =
                    `<p class="desc-box">${description}</p>`;
            }

            const folderName = title.trim().replace(/\s+/g, '_').replace(/[^\w-]/g, '');
            const basePath = `activity_images/${folderName}/`;
            const exts = ['jpg', 'jpeg', 'png', 'webp', 'gif'];
            const maxCheck = 50;
            let promises = [], validImages = [];

            for (let i = 1; i <= maxCheck; i++) {
                const num = i.toString().padStart(3, '0');
                exts.forEach(ext => {
                    const url = `${basePath}${num}.${ext}`;
                    promises.push(new Promise(resolve => {
                        const img = new Image();
                        img.src = url;
                        img.onload = () => { validImages.push({ url, num: i }); resolve(); };
                        img.onerror = resolve;
                    }));
                });
            }

            Promise.all(promises).then(() => {
                const container = document.getElementById('photos-container');
                container.innerHTML = '';

                if (validImages.length === 0) {
                    document.getElementById('error-message').innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-images"></i>
                            <h5>No photos found</h5>
                            <p>We couldn't find any photos for this activity yet.</p>
                        </div>`;
                    return;
                }

                validImages.sort((a, b) => a.num - b.num);
                galleryImages = validImages.map(v => v.url);

                // Show stats
                document.getElementById('photo-count').textContent = galleryImages.length;
                document.getElementById('stats-row').style.cssText = 'display:flex!important;';

                validImages.forEach(({ url }, index) => {
                    const delay = index * 45;
                    const col = document.createElement('div');
                    col.className = 'col-md-6 col-lg-4';
                    col.innerHTML = `
                        <div class="photo-card" style="animation-delay:${delay}ms" onclick="openLightbox(${index})">
                            <img src="${url}" class="gallery-img" alt="Photo ${index+1}" loading="lazy">
                            <div class="overlay">
                                <div class="overlay-icon"><i class="bi bi-zoom-in"></i></div>
                            </div>
                        </div>`;
                    container.appendChild(col);
                });
            });
        }

        function openLightbox(index) {
            currentImageIndex = index;
            const lb = document.getElementById('lightbox');
            updateLightboxImage();
            lb.style.display = 'block';
            setTimeout(() => lb.style.opacity = '1', 10);
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.style.opacity = '0';
            setTimeout(() => { lb.style.display = 'none'; document.body.style.overflow = ''; }, 300);
        }

        function handleWrapperClick(e) {
            if (e.target.classList.contains('lightbox-content-wrapper')) closeLightbox();
        }

        function changeImage(e, dir) {
            if (e) e.stopPropagation();
            currentImageIndex = (currentImageIndex + dir + galleryImages.length) % galleryImages.length;
            updateLightboxImage();
        }

        function updateLightboxImage() {
            const img = document.getElementById('lightbox-img');
            img.style.opacity = '0.4';
            img.style.transform = 'scale(0.96)';
            setTimeout(() => {
                img.src = galleryImages[currentImageIndex];
                img.style.opacity = '1';
                img.style.transform = 'scale(1)';
                document.getElementById('lb-current').textContent = currentImageIndex + 1;
                document.getElementById('lb-total').textContent = galleryImages.length;
            }, 160);
        }

        function showError(msg) {
            document.getElementById('activity-title').textContent = 'Error';
            document.getElementById('photos-container').innerHTML =
                `<div class="col-12"><div class="empty-state"><i class="bi bi-exclamation-triangle"></i><h5>${msg}</h5></div></div>`;
        }
    </script>
</body>
</html>
