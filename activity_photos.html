<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Photos - Health Screening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --main-gradient: linear-gradient(120deg, #2563eb, #06b6d4, #10b981);
            --bg-body: #020617; /* Matches main theme */
            --text-main: #f1f5f9;
            --glass-bg: rgba(30, 41, 59, 0.6);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --card-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            background-color: var(--bg-body);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Glass Effect */
        .navbar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: var(--glass-border);
            padding: 15px 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-weight: 900;
            background: var(--main-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
        }

        .nav-link {
            font-weight: 700;
            color: var(--text-main) !important;
            transition: 0.3s;
        }
        .nav-link:hover {
            color: #38bdf8 !important;
            transform: translateX(5px);
        }

        /* Improved Text Visibility */
        #activity-description {
            color: #ffffff !important;
            font-size: 1.1rem;
            line-height: 1.8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background: rgba(15, 23, 42, 0.4);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
            display: inline-block;
        }

        /* Gallery Grid Animation */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .photo-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: 20px;
            padding: 10px;
            box-shadow: var(--card-shadow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%;
            cursor: pointer;
            opacity: 0;
            animation: fadeInUp 0.8s forwards;
            position: relative;
            overflow: hidden;
        }

        .photo-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.3) 100%);
            opacity: 0;
            transition: 0.3s;
        }

        .photo-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 20px 50px rgba(6, 182, 212, 0.2);
        }

        .photo-card:hover::after { opacity: 1; }

        .gallery-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 14px;
            transition: transform 0.5s ease;
        }

        /* Enhanced Lightbox Styles */
        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 6, 23, 0.95); /* Slightly darker background */
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .lightbox-content-wrapper {
            position: relative;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 0;
        }

        .lightbox-img {
            max-width: 98vw;  /* Increased from 90% */
            max-height: 98vh; /* Increased from 85vh */
            width: auto;
            height: auto;
            border-radius: 8px; /* Sharper corners for large view */
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.1);
            animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            object-fit: contain; /* Ensure full image is visible */
        }

        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Enhanced Navigation Buttons */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 2.5rem; /* Larger icon */
            cursor: pointer;
            z-index: 2005;
            width: 70px; /* Larger button */
            height: 70px;
            background: rgba(0, 0, 0, 0.3); /* Darker background for visibility on bright images */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-btn:hover {
            background: rgba(56, 189, 248, 0.8);
            border-color: #38bdf8;
            color: #fff;
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
        }

        .nav-btn:active { transform: translateY(-50%) scale(0.95); }

        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            z-index: 2005;
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.8);
            border-color: #ef4444;
            color: #fff;
            transform: rotate(90deg);
        }

        /* Image Counter */
        .image-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 25px;
            border-radius: 50px;
            font-size: 1.1rem;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 2005;
        }

        .footer {
            margin-top: auto;
            padding: 40px 0;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-activity me-2"></i>Health Screening</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" href="activities.html">
                            <i class="bi bi-arrow-left-circle me-2 fs-5"></i> Back to Activities
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 140px; margin-bottom: 80px;">
        <!-- Header -->
        <div class="text-center mb-5" style="animation: fadeInUp 0.8s ease-out;">
            <h2 class="fw-bold display-4 mb-3 text-white" id="activity-title">
                <span class="spinner-border spinner-border-sm me-3" role="status"></span>Loading...
            </h2>
            <div class="px-md-5 mx-auto" style="max-width: 900px;">
                <p id="activity-description"></p>
            </div>
        </div>

        <!-- Photos Grid -->
        <div class="row g-4" id="photos-container">
            <!-- Photos will be injected here -->
        </div>

        <div id="error-message" class="text-center mt-5" style="display: none; animation: fadeInUp 0.5s;"></div>
    </div>

    <!-- Enhanced Lightbox Modal -->
    <div id="lightbox" class="lightbox-modal">
        <div class="close-btn" onclick="closeLightbox()"><i class="bi bi-x"></i></div>

        <div class="nav-btn prev-btn" onclick="changeImage(event, -1)">
            <i class="bi bi-chevron-left"></i>
        </div>

        <div class="nav-btn next-btn" onclick="changeImage(event, 1)">
            <i class="bi bi-chevron-right"></i>
        </div>

        <div class="lightbox-content-wrapper" onclick="handleWrapperClick(event)">
            <img class="lightbox-img" id="lightbox-img" src="">
        </div>

        <div class="image-counter" id="image-counter">1 / 1</div>
    </div>

    <div class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 Health Screening Project. All rights reserved.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global variables for lightbox
        let currentImageIndex = 0;
        let galleryImages = [];

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const activityTitle = urlParams.get('title');
            const activityDesc = urlParams.get('desc');

            if (!activityTitle) {
                showError("Activity not specified.");
                return;
            }

            setTimeout(() => {
                renderPage(activityTitle, activityDesc);
            }, 300);

            // Keyboard navigation for lightbox
            document.addEventListener('keydown', function(event) {
                if (document.getElementById('lightbox').style.display === 'block') {
                    if (event.key === 'Escape') closeLightbox();
                    if (event.key === 'ArrowLeft') changeImage(event, -1);
                    if (event.key === 'ArrowRight') changeImage(event, 1);
                }
            });
        });

        function renderPage(title, description) {
            const titleElem = document.getElementById('activity-title');
            const descElem = document.getElementById('activity-description');
            const container = document.getElementById('photos-container');
            const errorDiv = document.getElementById('error-message');

            titleElem.innerHTML = title;
            descElem.innerText = description || '';
            container.innerHTML = '';

            const folderName = title.trim().replace(/\s+/g, '_').replace(/[^\w-]/g, '');
            const baseFolderPath = `activity_images/${folderName}/`;

            const supportedExtensions = ['jpg', 'jpeg', 'png', 'webp', 'gif'];
            const maxImagesToCheck = 50;
            let checkPromises = [];
            let validImages = [];

            for (let i = 1; i <= maxImagesToCheck; i++) {
                const imageNumber = i.toString().padStart(3, '0');

                supportedExtensions.forEach(ext => {
                    const imageUrl = `${baseFolderPath}${imageNumber}.${ext}`;

                    const p = new Promise((resolve) => {
                        const img = new Image();
                        img.src = imageUrl;
                        img.onload = function() {
                            validImages.push({ url: imageUrl, num: i });
                            resolve();
                        };
                        img.onerror = function() {
                            resolve();
                        };
                    });
                    checkPromises.push(p);
                });
            }

            Promise.all(checkPromises).then(() => {
                 if (validImages.length === 0) {
                    showNoImagesError(baseFolderPath, errorDiv);
                } else {
                    validImages.sort((a, b) => a.num - b.num);
                    galleryImages = validImages.map(img => img.url);

                    validImages.forEach((imgData, index) => {
                        addImageToGallery(imgData.url, title, index, container);
                    });
                }
            });
        }

        function addImageToGallery(url, title, index, container) {
            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4';
            const delay = index * 50;

            col.innerHTML = `
                <div class="photo-card" style="animation-delay: ${delay}ms" onclick="openLightbox(${index})">
                    <img src="${url}" class="gallery-img" alt="${title}" loading="lazy">
                </div>
            `;
            container.appendChild(col);
        }

        // Lightbox Functions
        function openLightbox(index) {
            currentImageIndex = index;
            const lightbox = document.getElementById('lightbox');
            updateLightboxImage();

            lightbox.style.display = 'block';
            setTimeout(() => {
                lightbox.style.opacity = '1';
            }, 10);

            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.style.opacity = '0';
            setTimeout(() => {
                lightbox.style.display = 'none';
                document.body.style.overflow = 'auto';
            }, 300);
        }

        function handleWrapperClick(event) {
            // Close if clicking outside the image
            if (event.target.classList.contains('lightbox-content-wrapper')) {
                closeLightbox();
            }
        }

        function changeImage(event, direction) {
            if(event) event.stopPropagation();

            currentImageIndex += direction;

            if (currentImageIndex >= galleryImages.length) {
                currentImageIndex = 0;
            } else if (currentImageIndex < 0) {
                currentImageIndex = galleryImages.length - 1;
            }

            updateLightboxImage();
        }

        function updateLightboxImage() {
            const img = document.getElementById('lightbox-img');
            const counter = document.getElementById('image-counter');

            // Fade out slightly before changing
            img.style.opacity = 0.5;
            img.style.transform = "scale(0.95)";

            setTimeout(() => {
                img.src = galleryImages[currentImageIndex];
                img.style.opacity = 1;
                img.style.transform = "scale(1)";
                counter.innerText = `${currentImageIndex + 1} / ${galleryImages.length}`;
            }, 150);
        }

        function showNoImagesError(path, errorDiv) {
            errorDiv.style.display = 'block';
            errorDiv.innerHTML = `
                <div class="py-5" style="background: rgba(255,255,255,0.05); border-radius: 20px; padding: 40px; border: 1px solid rgba(255,255,255,0.1);">
                    <i class="bi bi-images display-1 text-white opacity-50"></i>
                    <h4 class="mt-4 text-white">No photos found</h4>
                    <p class="text-white-50">We couldn't find any photos for this activity.</p>
                </div>`;
        }

        function showError(msg) {
            document.getElementById('activity-title').innerText = "Error";
            document.getElementById('photos-container').innerHTML = `<div class="col-12 text-center text-danger fw-bold fs-4">${msg}</div>`;
        }
    </script>
</body>
</html>
