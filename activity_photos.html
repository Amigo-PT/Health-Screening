<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Photos - Health Screening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        :root {
            --main-gradient: linear-gradient(120deg, #2563eb, #06b6d4, #10b981);
            --bg-body: #020617;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.6);
            --glass-border: 1px solid rgba(255, 255, 255, 0.07);
            --radius: 20px;
        }

        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(ellipse at 15% 10%, rgba(37, 99, 235, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 85%, rgba(16, 185, 129, 0.07) 0%, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeInPage 0.8s ease-out;
        }

        /* المربعات الوهمية أثناء التحميل */
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }

        .navbar { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 16px 0; z-index: 100; }
        .navbar-brand { font-weight: 900; background: var(--main-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .page-hero { padding: 140px 0 60px; text-align: center; }
        .title-gradient { background: var(--main-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .desc-box { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 18px 28px; display: inline-block; margin-top: 10px; color: #cbd5e1; }

        .photo-card {
            background: var(--card-bg); border: var(--glass-border); border-radius: var(--radius);
            overflow: hidden; cursor: pointer; position: relative; transition: 0.4s;
        }
        .photo-card:hover { transform: translateY(-10px); box-shadow: 0 20px 50px -10px rgba(6, 182, 212, 0.2); }
        .gallery-img { width: 100%; height: 260px; object-fit: cover; transition: 0.5s; }
        .photo-card:hover .gallery-img { transform: scale(1.07); }

        .lightbox-modal { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(2, 6, 23, 0.97); backdrop-filter: blur(20px); opacity: 0; transition: 0.3s; }
        .lightbox-img { max-width: 90vw; max-height: 85vh; border-radius: 12px; }
        .lb-close { position: absolute; top: 20px; right: 24px; font-size: 2rem; color: #fff; cursor: pointer; }
        .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="navbar fixed-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="index.html"><i class="bi bi-activity me-2"></i>Health Screening</a>
            <a href="activities.html" class="btn btn-outline-light btn-sm rounded-pill px-3">Back</a>
        </div>
    </nav>

    <section class="page-hero">
        <div class="container">
            <h1 class="page-title" id="activity-title"><span class="title-gradient">Loading...</span></h1>
            <div id="activity-description"></div>
        </div>
    </section>

    <section class="gallery-section">
        <div class="container">
            <div class="row g-4" id="photos-container"></div>
        </div>
    </section>

    <div id="lightbox" class="lightbox-modal">
        <span class="lb-close" onclick="closeLightbox()">&times;</span>
        <div class="lb-nav" style="left: 20px;" onclick="changeImage(-1)"><i class="bi bi-chevron-left"></i></div>
        <div class="lb-nav" style="right: 20px;" onclick="changeImage(1)"><i class="bi bi-chevron-right"></i></div>
        <div class="d-flex align-items-center justify-content-center h-100">
            <img class="lightbox-img" id="lightbox-img" src="">
        </div>
    </div>

    <script>
        let galleryData = [];
        let currentIndex = 0;

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const title = params.get('title');
            const desc = params.get('desc');

            if (title) {
                renderPage(title, desc);
            }
        });

        async function renderPage(title, desc) {
            document.getElementById('activity-title').innerHTML = `<span class="title-gradient">${title}</span>`;
            if (desc) document.getElementById('activity-description').innerHTML = `<p class="desc-box">${desc}</p>`;

            // معالجة اسم المجلد (تبديل المسافات بـ _ )
            const folderName = title.trim().replace(/\s+/g, '_');
            const jsonPath = `activity_images/${folderName}/photos.json`;

            const container = document.getElementById('photos-container');
            
            try {
                const response = await fetch(jsonPath);
                if (!response.ok) throw new Error('JSON not found');
                
                galleryData = await response.json();
                container.innerHTML = '';

                galleryData.forEach((item, index) => {
                    const col = document.createElement('div');
                    col.className = 'col-md-6 col-lg-4';
                    col.innerHTML = `
                        <div class="photo-card" onclick="openLightbox(${index})">
                            <img src="${item.url}" class="gallery-img" loading="lazy">
                            <div style="padding:15px; background: rgba(0,0,0,0.3)">
                                <small class="text-info">${item.name || 'Photo ' + (index+1)}</small>
                            </div>
                        </div>`;
                    container.appendChild(col);
                });

            } catch (err) {
                container.innerHTML = `<div class="text-center py-5 text-muted"><i class="bi bi-folder-x fs-1"></i><p>Could not find photos.json in: ${folderName}</p></div>`;
            }
        }

        function openLightbox(index) {
            currentIndex = index;
            const lb = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = galleryData[currentIndex].url;
            lb.style.display = 'block';
            setTimeout(() => lb.style.opacity = '1', 10);
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.style.opacity = '0';
            setTimeout(() => { lb.style.display = 'none'; document.body.style.overflow = ''; }, 300);
        }

        function changeImage(dir) {
            currentIndex = (currentIndex + dir + galleryData.length) % galleryData.length;
            document.getElementById('lightbox-img').src = galleryData[currentIndex].url;
        }
    </script>
</body>
</html>
